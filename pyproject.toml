[project]
name = "sdlf"
version = "2.10.0"
description = "AWS Serverless Data Lake Framework"
readme = "README.md"
authors = [
    { name = "Amazon Web Services" }
]
license = "MIT-0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.187.0",
    "constructs>=10.0.0,<11.0.0",
]

[project.urls]
Documentation = "https://sdlf.readthedocs.io/en/latest/"
Repository = "https://github.com/aws-solutions-library-samples/data-lakes-on-aws"
Workshop = "https://sdlf.workshop.aws"

[tool.uv.workspace]
members = ["sdlf-*"]
exclude = ["sdlf-cicd", "sdlf-monitoring", "sdlf-stageA", "sdlf-stageB", "sdlf-utils", "sdlf-datalakeLibrary", "sdlf-stage-dataquality"]

[tool.ruff]
extend-exclude = ["sdlf-cicd/sam-translate.py"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "PL", "W"]
ignore = ["PLR0912", "PLR0913", "PLR0915"]
fixable = ["I001", "W291"]

[tool.pylint.main]
py-version = "3.12"
ignore-paths = ["^/sdlf-cicd/sam-translate.py"]
jobs = 0

[tool.pylint.format]
max-line-length = 120
max-module-lines = 1500

[tool.pylint.logging]
# The type of string formatting that logging methods do. `old` means using %
# formatting, `new` is for `{}` formatting.
logging-format-style = "new"

# Logging modules to check that the string format arguments are in logging
# function parameter format.
logging-modules = ["logging", "datalake_library.commons"]

[tool.pylint.similarities]
min-similarity-lines = 10
